name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag, for example v0.6.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.release.outputs.matrix }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Read target jars from the GitHub release
        id: release
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          version="$(git show "$RELEASE_TAG:gradle.properties" | sed -n 's/^mod_version=//p')"
          test -n "$version"
          test "$RELEASE_TAG" = "v$version" || {
            echo "Release tag $RELEASE_TAG does not match mod_version $version" >&2
            exit 1
          }
          release_json="$(gh release view "$RELEASE_TAG" --json assets)"

          if git cat-file -e "$RELEASE_TAG:gradle/release-targets.json" 2>/dev/null; then
            targets="$(git show "$RELEASE_TAG:gradle/release-targets.json" | jq -c --arg version "$version" --argjson assets "$release_json" '
              [.include[]
               | (.loader // "fabric") as $loader
               | (if $loader == "neoforge" then "-neoforge" else "" end) as $suffix
               | ("soullink-" + .target_label + $suffix + "-" + $version + ".jar") as $jar
               | select([$assets.assets[].name] | index($jar) != null)
               | {target_label: .target_label,
                  display_target: (.target_label | ltrimstr("mc")),
                  minecraft_versions: .minecraft_versions,
                  loader: $loader,
                  jar_name: $jar}]
            ')"
            expected_count="$(git show "$RELEASE_TAG:gradle/release-targets.json" | jq '.include | length')"
            test "$(jq 'length' <<< "$targets")" -eq "$expected_count" || {
              echo "Release jars do not match gradle/release-targets.json" >&2
              exit 1
            }
          else
            targets="$(jq -c --arg version "$version" '
              [.assets[].name
                | select(startswith("soullink-mc") and endswith("-" + $version + ".jar"))
                | (ltrimstr("soullink-mc") | rtrimstr("-" + $version + ".jar")) as $target
                | ($target | capture("^(?<minecraft_version>[0-9]+(\\.[0-9]+)+)(?<loader_suffix>-neoforge)?$") // empty)
                | {target_label: ("mc" + .minecraft_version),
                   display_target: .minecraft_version,
                   minecraft_versions: [.minecraft_version],
                   loader:(if .loader_suffix == "-neoforge" then "neoforge" else "fabric" end),
                   jar_name:("soullink-mc" + $target + "-" + $version + ".jar")}]
              | unique_by([.target_label, .loader])
            ' <<< "$release_json")"
          fi

          test "$(jq 'length' <<< "$targets")" -gt 0 || {
            echo "No Soul Link runtime jars for version $version are attached to $RELEASE_TAG" >&2
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -cn --argjson include "$targets" '{include:$include}')" >> "$GITHUB_OUTPUT"

  project:
    if: github.event_name == 'workflow_dispatch' || vars.MODRINTH_PROJECT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.project.outputs.project_id }}
      terrarasa_id: ${{ steps.terra_rasa.outputs.project_id }}
      fabric_api_id: ${{ steps.fabric_api.outputs.project_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve Soul Link Modrinth project ID
        id: project
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          EXPECTED_SOURCE_URL: https://github.com/qwasdf-1/soul-link
          MODRINTH_USER_AGENT: qwasdf-1/soul-link-github-publisher
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          result="$(python3 .github/scripts/resolve_modrinth_project.py)"
          project_id="$(jq -er '.id' <<< "$result")"
          project_slug="$(jq -er '.slug' <<< "$result")"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "Resolved Soul Link Modrinth project: $project_slug ($project_id)." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Terra Rasa Modrinth project ID
        id: terra_rasa
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_TERRA_RASA_PROJECT_ID }}
          EXPECTED_SOURCE_URL: https://github.com/qwasdf-1/terra-rasa
          MODRINTH_USER_AGENT: qwasdf-1/soul-link-github-publisher
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          result="$(python3 .github/scripts/resolve_modrinth_project.py)"
          project_id="$(jq -er '.id' <<< "$result")"
          project_slug="$(jq -er '.slug' <<< "$result")"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "Resolved Terra Rasa Modrinth project: $project_slug ($project_id)." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Fabric API project ID
        id: fabric_api
        run: |
          set -euo pipefail
          project="$(curl --fail-with-body --silent --show-error -H 'User-Agent: qwasdf-1/soul-link-github-publisher' https://api.modrinth.com/v2/project/fabric-api)"
          [[ "$(jq -er '.slug' <<< "$project")" == "fabric-api" ]]
          echo "project_id=$(jq -er '.id' <<< "$project")" >> "$GITHUB_OUTPUT"

  publish:
    name: publish (${{ matrix.target_label }} ${{ matrix.loader }})
    needs: [release, project]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      PROJECT_ID: ${{ needs.project.outputs.project_id }}
      TERRARASA_ID: ${{ needs.project.outputs.terrarasa_id }}
      FABRIC_API_ID: ${{ needs.project.outputs.fabric_api_id }}
      VERSION: ${{ needs.release.outputs.version }}
      TARGET_LABEL: ${{ matrix.target_label }}
      DISPLAY_TARGET: ${{ matrix.display_target }}
      GAME_VERSIONS: ${{ toJSON(matrix.minecraft_versions) }}
      LOADER: ${{ matrix.loader }}
      JAR_NAME: ${{ matrix.jar_name }}
    steps:
      - name: Download and verify release jar
        run: |
          set -euo pipefail
          test -n "$MODRINTH_TOKEN" || { echo "Set MODRINTH_TOKEN with VERSION_CREATE permission" >&2; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "$JAR_NAME" --pattern SHA256SUMS --dir dist
          expected="$(awk -v name="$JAR_NAME" '$2 == name { print $1 }' dist/SHA256SUMS)"
          actual="$(sha256sum "dist/$JAR_NAME" | cut -d ' ' -f 1)"
          test -n "$expected" && test "$actual" = "$expected" || {
            echo "SHA-256 verification failed for $JAR_NAME" >&2
            exit 1
          }
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/changelog.md"
          test -s "$RUNNER_TEMP/changelog.md"

      - name: Publish ${{ matrix.target_label }} (${{ matrix.loader }}) version to Modrinth
        run: |
          set -euo pipefail
          version_suffix=""
          loader_label=""
          loader_dependency=""
          # Terra Rasa is bundled in the Fabric jar, so it is embedded there; NeoForge jars declare
          # it as a required dependency instead, because the library is installed as its own mod.
          terrarasa_dependency_type=""
          case "$LOADER" in
            fabric)
              loader_dependency="$FABRIC_API_ID"
              terrarasa_dependency_type="embedded"
              ;;
            neoforge)
              version_suffix="-neoforge"
              loader_label=" NeoForge"
              loader_dependency=""
              terrarasa_dependency_type="required"
              ;;
            *)
              echo "Unsupported loader '$LOADER' for $TARGET_LABEL" >&2
              exit 1
              ;;
          esac
          version_number="${VERSION}-${TARGET_LABEL}${version_suffix}"
          version_name="Soul Link $VERSION (Minecraft $DISPLAY_TARGET${loader_label})"
          environment="server_only"
          case "$VERSION" in
            0.1.0|0.2.0) environment="dedicated_server_only" ;;
          esac
          existing_response="$RUNNER_TEMP/existing-version.json"
          if ! existing_status="$(curl --silent --show-error --output "$existing_response" --write-out '%{http_code}' \
            -H 'User-Agent: qwasdf-1/soul-link-github-publisher' \
            "https://api.modrinth.com/v2/project/${PROJECT_ID}/version/${version_number}")"; then
            echo "Could not check whether Modrinth version $version_number already exists." >&2
            test ! -s "$existing_response" || cat "$existing_response" >&2
            exit 1
          fi

          if [[ "$existing_status" == "200" ]]; then
            expected_sha512="$(sha512sum "dist/$JAR_NAME" | cut -d ' ' -f 1)"
            existing_sha512="$(jq -r --arg jar "$JAR_NAME" '.files[] | select(.filename == $jar and .primary == true) | .hashes.sha512' "$existing_response" | head -n 1)"
            if jq -e \
              --arg project "$PROJECT_ID" \
              --arg version "$version_number" \
              --arg name "$version_name" \
              --argjson game_versions "$GAME_VERSIONS" \
              --arg loader "$LOADER" \
              --arg environment "$environment" \
              --arg loader_dependency "$loader_dependency" \
              --arg terrarasa "$TERRARASA_ID" \
              --arg terrarasa_type "$terrarasa_dependency_type" \
              --rawfile changelog "$RUNNER_TEMP/changelog.md" \
              '.project_id == $project
                and .version_number == $version
                and .name == $name
                and .changelog == $changelog
                and .game_versions == $game_versions
                and .loaders == [$loader]
                and .version_type == "release"
                and .environment == $environment
                and .featured == false
                and .status == "listed"
                and (if $loader_dependency == "" then (.dependencies | length) == 1
                     else any(.dependencies[]; .project_id == $loader_dependency and .dependency_type == "required") end)
                and any(.dependencies[]; .project_id == $terrarasa and .dependency_type == $terrarasa_type)' \
              "$existing_response" >/dev/null && [[ "$existing_sha512" == "$expected_sha512" ]]; then
              echo "Modrinth version $version_number already matches the release asset; skipping upload."
              exit 0
            fi
            echo "Modrinth version $version_number exists but its metadata or file differs from this release." >&2
            exit 1
          elif [[ "$existing_status" != "404" ]]; then
            echo "Could not check existing Modrinth version $version_number (HTTP $existing_status):" >&2
            cat "$existing_response" >&2
            exit 1
          fi

          dependencies="$(jq -cn --arg loader_dependency "$loader_dependency" \
            --arg terrarasa "$TERRARASA_ID" --arg terrarasa_type "$terrarasa_dependency_type" \
            'if $loader_dependency == "" then [{project_id:$terrarasa,dependency_type:$terrarasa_type}]
             else [{project_id:$loader_dependency,dependency_type:"required"},{project_id:$terrarasa,dependency_type:$terrarasa_type}] end')"
          expected_dependencies=2
          [ -n "$loader_dependency" ] || expected_dependencies=1
          test "$(jq 'length' <<< "$dependencies")" -eq "$expected_dependencies" || {
            echo "Could not build the Modrinth dependency list for $LOADER" >&2
            exit 1
          }
          jq -n --rawfile changelog "$RUNNER_TEMP/changelog.md" \
            --arg name "$version_name" \
            --arg version "$version_number" \
            --arg project "$PROJECT_ID" \
            --argjson game_versions "$GAME_VERSIONS" \
            --arg loader "$LOADER" \
            --arg environment "$environment" \
            --argjson dependencies "$dependencies" \
            '{name:$name, version_number:$version, changelog:$changelog, dependencies:$dependencies, game_versions:$game_versions, version_type:"release", loaders:[$loader], environment:$environment, featured:false, status:"listed", project_id:$project, file_parts:["modfile"], primary_file:"modfile"}' \
            > "$RUNNER_TEMP/modrinth-version.json"
          response_file="$RUNNER_TEMP/modrinth-response.json"
          if ! http_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H 'User-Agent: qwasdf-1/soul-link-github-publisher' \
            -F "data=@$RUNNER_TEMP/modrinth-version.json;type=application/json" \
            -F "modfile=@dist/$JAR_NAME" \
            https://api.modrinth.com/v2/version)"; then
            echo "Could not connect to the Modrinth version upload endpoint." >&2
            test ! -s "$response_file" || cat "$response_file" >&2
            exit 1
          fi
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "Modrinth version upload failed with HTTP $http_status:" >&2
            if ! jq -e . "$response_file" >/dev/null 2>&1; then
              cat "$response_file" >&2
            else
              jq -r 'if type == "object" then [(.error // empty), (.description // empty)] | map(select(length > 0)) | join(": ") else tostring end' "$response_file" >&2
            fi
            exit 1
          fi
          jq -er 'select(.id and .version_number) | "Published Modrinth version \(.version_number) (\(.id))"' "$response_file"
