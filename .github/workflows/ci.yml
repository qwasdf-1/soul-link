name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Soul Link builds against a Terra Rasa checkout next to it (settings.gradle includes ../terra-rasa).
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soul-link
    steps:
      - uses: actions/checkout@v4
        with:
          path: soul-link

      - uses: actions/checkout@v4
        with:
          repository: qwasdf-1/terra-rasa
          path: terra-rasa

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: ./gradlew build

  # The real dedicated-server suites download the vanilla server (and, for the modpack suite, the pinned
  # mods) and take about half an hour.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: soul-link
    steps:
      - uses: actions/checkout@v4
        with:
          path: soul-link

      - uses: actions/checkout@v4
        with:
          repository: qwasdf-1/terra-rasa
          path: terra-rasa

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Integration and modpack suites
        run: ./gradlew integrationTest modpackTest --continue
