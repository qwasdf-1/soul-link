[project]
name = "soullink-testing"
version = "0.1.0"
description = "Real dedicated-server integration tests for the Soul Link Fabric mod"
requires-python = ">=3.14"
dependencies = ["pytest>=8.3", "terra-rasa-testkit"]

[tool.uv]
package = false

[tool.uv.sources]
# The test kit ships with Terra Rasa or workspace; workspace takes precedence
terra-rasa-testkit = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not slow and not modpack\""
markers = [
    "slow: long-running stress or longevity scenarios",
    "modpack: needs the reference modpack server (./gradlew modpackTest)",
    "neoforge: applies to the NeoForge install only (./gradlew integrationTest -Ploader=neoforge)",
]
