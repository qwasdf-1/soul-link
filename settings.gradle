pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'soullink'

// Soul Link uses the matching Terra Rasa artifact (dev.terrarasa:terra-rasa-mc<version>). A checkout
// next to this one (../terra-rasa) replaces that artifact, so both can be changed and tested together;
// pass -PterraRasaPath=<dir> to use another checkout, or -PterraRasaPath= to use the published artifact.
def terraRasaPath = providers.gradleProperty('terraRasaPath').getOrElse('../terra-rasa').trim()
def minecraftVersion = providers.gradleProperty('minecraft_version').getOrElse('26.2')
if (terraRasaPath) {
    def terraRasa = file(terraRasaPath)
    if (!new File(terraRasa, 'settings.gradle').isFile()) {
        throw new GradleException("Terra Rasa checkout not found at ${terraRasa}; set -PterraRasaPath= to use the published target artifact")
    }
    includeBuild(terraRasa) {
        dependencySubstitution {
            substitute module("dev.terrarasa:terra-rasa-mc${minecraftVersion}") using project(':')
        }
    }
}
