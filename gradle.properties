org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Default local target. CI and release builds override these values per supported game version.
# loader selects which loader's source sets, dependencies and metadata are built: fabric or neoforge.
loom_version=1.18.4
loader=fabric
minecraft_version=26.2
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.2
# NeoForge build inputs, used only when loader=neoforge; CI overrides these per target.
moddev_version=2.0.148
neoforge_version=26.2.0.93
java_version=25

mod_version=0.4.3
# The target-matched Terra Rasa artifact Soul Link is built against.
terra_rasa_version=0.3.2
maven_group=dev.soullink
mod_id=soullink
fabric_installer_version=1.1.2
