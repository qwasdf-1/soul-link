[project]
name = "soullink-testing"
version = "0.1.0"
description = "Real dedicated-server integration tests for the Soul Link Fabric mod"
requires-python = ">=3.14"
dependencies = ["pytest>=8.3", "terra-rasa-testkit"]

[tool.uv]
package = false

[tool.uv.sources]
# The test kit ships with Terra Rasa; the checkout next to this one, as for the Gradle build.
terra-rasa-testkit = { path = "../../terra-rasa/testing", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not slow and not modpack\""
markers = [
    "slow: long-running stress or longevity scenarios",
    "modpack: needs the reference modpack server (./gradlew modpackTest)",
]
