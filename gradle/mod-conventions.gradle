// Shared setup for the mods in this build.
// Applied after the Loom plugin; `modArchiveName` must be set before applying.

def javaVersion = rootProject.java_version.toInteger()
def minecraftVersion = rootProject.minecraft_version

group = rootProject.maven_group
version = rootProject.mod_version
base {
    archivesName = "${project.ext.modArchiveName}-mc${minecraftVersion}"
}

repositories {
    mavenCentral()
    // Terra Rasa releases published with ./gradlew publishToMavenLocal, until it has a public Maven.
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    def expandedValues = [
        version: project.version.toString(),
        minecraft_version: minecraftVersion,
        loader_version: rootProject.fabric_loader_version,
        java_version: javaVersion.toString(),
        terra_rasa_version: rootProject.terra_rasa_version
    ]
    inputs.properties expandedValues
    filesMatching('fabric.mod.json') {
        expand expandedValues
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "LICENSE_${project.ext.modArchiveName}" }
    }
}
